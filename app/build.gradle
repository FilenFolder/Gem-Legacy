plugins {
    id 'com.android.application'
}

android {
    namespace 'com.filenfolder.gemlegacy'
    compileSdk 34

    defaultConfig {
        applicationId "com.filenfolder.gemlegacy"
        minSdk 16
        targetSdk 34
        versionCode 3
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
